[package]
name = "altair-vega"
version = "0.9.3"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/EL-File4138/Altair-Vega"
description = "Peer-to-peer transfer for messages, files, and two-peer folder sync."

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
iroh-tickets = "1.0.0"
rand = "0.10.3"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spake2 = { version = "0.4.0", features = ["getrandom"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3.34"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "0.101.0", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.101.0"
iroh-mdns-address-lookup = "0.6.0"
notify = "8.2.0"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.54.0", features = ["io-util", "macros", "rt", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
